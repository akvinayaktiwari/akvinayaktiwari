name: Generate Profile Animations

on:
  schedule:
    # Every 12 hours, so the snake stays in sync with the contribution grid.
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # Builds Platane/snk from source rather than using its published action.
      # The snake growing as it eats needs a different router, not a different
      # option -- see scripts/patch-snake-growth.mjs for the why.
      - name: Check out this repo (for the patch script)
        uses: actions/checkout@v4

      - name: Check out snk
        uses: actions/checkout@v4
        with:
          repository: Platane/snk
          # Pinned: the patch asserts on specific upstream source and fails the
          # build if it moves, rather than silently emitting a stock snake.
          ref: a041d6c27ba561a39f5be9c26a784812765e434b
          path: .snk

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Apply the snake growth patch
        run: node scripts/patch-snake-growth.mjs .snk

      - name: Install snk dependencies
        run: bun install --frozen-lockfile
        working-directory: .snk

      # getGrowingRoute re-checks its own chain against the rules of snake and
      # throws on a violation, so this step fails the run rather than publishing
      # an animation where the snake eats itself.
      - name: Generate the snake animation
        working-directory: .snk
        env:
          INPUT_GITHUB_USER_NAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_OUTPUTS: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        run: bun packages/action/index.ts

      # Generated into the same output branch as the snake rather than committed
      # back to main, so the repo stays source-only. No continue-on-error: the
      # publish step replaces the whole branch, so a partial run would delete
      # whichever file failed to build. Failing loudly leaves the last good
      # output branch untouched instead.
      - name: Generate the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect the 3D calendar alongside the snake
        run: |
          cp profile-3d-contrib/profile-night-green.svg .snk/dist/
          cp profile-3d-contrib/profile-green-animate.svg .snk/dist/
          ls -l .snk/dist/

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .snk/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
